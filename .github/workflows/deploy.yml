# Авто-деплой на Render после зелёного check на main (#57/#58).
#
# Почему так: сервис book-a-call создавался через API/MCP (#41) без
# dashboard-флоу GitHub App — вебхука Render на репо нет, авто-деплой
# Render («On Commit») не узнаёт о пушах. Вместо переподключения источника
# дёргаем Deploy Hook сервиса из Actions: деплой стартует только после
# успешного `make check` (workflow_run), т.е. прод получает исключительно
# проверенный код. Hook живёт в секретах (RENDER_DEPLOY_HOOK), ротация —
# Render → Settings → Deploy Hook → Regenerate.

name: deploy

on:
  workflow_run:
    workflows: [check]
    types: [completed]

permissions:
  contents: read

jobs:
  render:
    # только зелёный check на main (workflow_run не фильтрует ветку сам)
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        run: |
          response=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$RENDER_DEPLOY_HOOK")
          echo "deploy hook HTTP $response"
          test "$response" = 200
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
